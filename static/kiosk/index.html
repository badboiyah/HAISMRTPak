<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAISMRTPak · Cổng vào</title><link rel="icon" href="/static/brand/favicon.png"><link rel="stylesheet" href="/static/kiosk/style.css"><script src="/static/vendor/qrcode.js" defer></script><script src="/static/kiosk/app.js" defer></script></head>
<body><main><header><img src="/static/brand/logo.png" alt="HAISMRTPak"><span>CỔNG BÃI XE</span></header>
<section id="setup"><h1>Kết nối màn hình cổng</h1><p>Chủ bãi đăng nhập một lần để máy tính bảng hiển thị mã QR cho người gửi xe.</p><form id="pair-form"><label>Mật khẩu quản trị<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Kết nối máy tính bảng</button></form><p id="setup-error" role="alert"></p><a href="/">Trang quản trị</a></section>
<section id="display" hidden><label>Hướng cổng <select id="direction"><option value="entry">Cổng vào</option><option value="exit">Cổng ra</option></select></label><p id="mode"></p><h1 id="title">Đang kết nối…</h1><p id="description" role="status"></p><canvas id="qr" hidden aria-label="Mã QR xác nhận vào bãi"></canvas><p id="countdown"></p><button id="renew" hidden>Tạo lại mã QR</button><p class="instruction">1. Mở camera điện thoại và quét QR<br>2. Đăng nhập hoặc tạo tài khoản<br>3. Xác nhận vào / ra bãi và chờ thanh chắn mở</p><div id="simulation" hidden><div><button id="arrive">Xe đang chờ tại cổng</button><button id="leave">Xe đã rời cổng</button></div></div></section>
</main></body></html>
